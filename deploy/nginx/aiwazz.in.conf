# AiWazz: aiwazz.in (managed in git: deploy/nginx/aiwazz.in.conf)

# Force HTTPS (keep /.well-known/ on http for certificate renewal)
set $aiwazz_https_redirect 0;
if ($scheme = http) { set $aiwazz_https_redirect 1; }
if ($uri ~ "^/\.well-known/") { set $aiwazz_https_redirect 0; }
if ($aiwazz_https_redirect = 1) { return 301 https://$host$request_uri; }

# Common aliases for policy pages (Razorpay / Meta reviewers, old links)
location = /terms-and-conditions { return 301 /terms/; }
location = /privacy-policy       { return 301 /privacy/; }
location = /refund               { return 301 /refund-policy/; }
location = /cancellation-policy  { return 301 /refund-policy/; }
location = /shipping             { return 301 /shipping-policy/; }
location = /delivery-policy      { return 301 /shipping-policy/; }

# Contact form → AiWazz API (same origin, so no CORS). Only this one endpoint is exposed here.
location = /api/contact {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8100/api/contact;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}

location = /site.webmanifest {
    default_type application/manifest+json;
}
