# AiWazz: login.aiwazz.in app + API (managed in git: deploy/nginx/login.aiwazz.in.conf)

# Force HTTPS (session cookies are Secure-only); keep /.well-known/ on http for certificate renewal.
set $aiwazz_https_redirect 0;
if ($scheme = http) { set $aiwazz_https_redirect 1; }
if ($uri ~ "^/\.well-known/") { set $aiwazz_https_redirect 0; }
if ($aiwazz_https_redirect = 1) { return 301 https://$host$request_uri; }

# API → FastAPI on 127.0.0.1:8100. ^~ so the regex locations (.js/.css/images) never catch /api/.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: clients can't spoof their IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 64k;
    access_log /www/wwwlogs/login.aiwazz.in.api.log;
}

# Hashed build assets: cache for a year.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000";
    access_log off;
}

location = /site.webmanifest {
    default_type application/manifest+json;
}

# Single-page app: unknown paths (/login, /generate, ...) get index.html, never cached.
location / {
    try_files $uri $uri/ /index.html;
}
location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000";
}
